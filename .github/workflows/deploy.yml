name: Deploy ads-mcp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker + sync secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            MCP_SECRET
            YANDEX_DIRECT_TOKEN
            YANDEX_DIRECT_LOGIN
            VK_ADS_TOKEN
            GOOGLE_ADS_DEVELOPER_TOKEN
            GOOGLE_ADS_CLIENT_ID
            GOOGLE_ADS_CLIENT_SECRET
            GOOGLE_ADS_REFRESH_TOKEN
            GOOGLE_ADS_LOGIN_CUSTOMER_ID
        env:
          MCP_SECRET: ${{ secrets.MCP_SECRET }}
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN || 'x' }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN || 'x' }}
          VK_ADS_TOKEN: ${{ secrets.VK_ADS_TOKEN || 'x' }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN || 'x' }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID || 'x' }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET || 'x' }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN || 'x' }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID || 'x' }}
